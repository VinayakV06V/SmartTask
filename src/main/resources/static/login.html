
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartTask</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            background: #101827; color: #f8fafc;
            font-family: Arial, sans-serif; padding: 20px;
        }
        .card {
            width: 100%; max-width: 420px; background: #1e293b;
            padding: 32px; border-radius: 16px;
        }
        h1 { margin-top: 0; }
        p { color: #94a3b8; }
        label { display: block; margin: 16px 0 7px; }
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #475569; background: #0f172a;
            color: white; font-size: 15px;
        }
        button {
            width: 100%; padding: 13px; margin-top: 22px;
            border: 0; border-radius: 8px; background: #6366f1;
            color: white; font-weight: bold; cursor: pointer;
        }
        #message { overflow-wrap: anywhere; }
        a { color: #a5b4fc; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Welcome back</h1>
        <p>Sign in to manage your tasks and habits.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>

        <p id="message" role="status"></p>
        <p>New to SmartTask? <a href="/register.html">Create an account</a></p>
    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            message.textContent = "Signing in...";

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.error || "Login failed. Check your email and password.";
                    return;
                }

                window.location.href = "/";
            } catch (error) {
                message.textContent =
                    "Could not connect to SmartTask. Check that the server is running.";
            }
        });
    </script>
</body>
</html>
